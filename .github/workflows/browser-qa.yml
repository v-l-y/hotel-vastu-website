name: Browser QA

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/browser-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install browser QA dependencies
        run: npm install --package-lock=false
      - name: Audit browser QA dependencies
        run: npm audit --no-package-lock --audit-level=high
      - name: Resolve system Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No system Chrome/Chromium found on runner."
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hotel-vastu-server.log 2>&1 &
          echo $! > /tmp/hotel-vastu-server.pid
      - name: Wait for server
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/hotel-vastu-server.log
          exit 1
      - name: Run browser and accessibility QA
        env:
          BASE_URL: http://127.0.0.1:4173
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: node scripts/browser-check.mjs
      - name: Run site-wide Lighthouse quality gates
        run: |
          PAGES=(
            index.html
            rooms.html
            classic-room.html
            club-room.html
            premium-room.html
            facilities.html
            restaurant.html
            gallery.html
            about.html
            contact.html
            hotel-near-rps-more.html
            hotel-near-danapur-railway-station.html
          )
          run_lighthouse() {
            local page="$1"
            local report="$2"
            npx lighthouse "http://127.0.0.1:4173/$page"               --chrome-path="$CHROME_PATH"               --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"               --only-categories=performance,accessibility,best-practices,seo               --output=json               --output-path="$report"               --quiet
            node scripts/lighthouse-check.mjs "$page" "$report"
          }
          echo "Warming Chrome and Lighthouse before strict scoring..."
          warmup_report="/tmp/lighthouse-warmup.json"
          npx lighthouse "http://127.0.0.1:4173/index.html"             --chrome-path="$CHROME_PATH"             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"             --only-categories=performance             --output=json             --output-path="$warmup_report"             --quiet

          for page in "${PAGES[@]}"; do
            safe_name="$(echo "$page" | tr '/.' '__')"
            report="/tmp/lighthouse-${safe_name}.json"
            run_lighthouse "$page" "$report"
          done
