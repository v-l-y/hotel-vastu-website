name: Audit Rendered Live Photos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-rendered-live-photos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit rendered first-party photos
        run: node scripts/audit-live-rendered-images.mjs
