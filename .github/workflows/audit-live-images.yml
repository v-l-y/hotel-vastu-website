name: Audit Live Image Inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-live-images.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Discover current first-party image assets
        run: node scripts/discover-live-images.mjs
