name: Discover Live Hotel Images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-live-images.yml"
      - "scripts/discover-live-images.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Discover first-party image URLs
        run: node scripts/discover-live-images.mjs
