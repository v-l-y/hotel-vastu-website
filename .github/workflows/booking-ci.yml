name: Booking CI

on:
  push:
    branches: [main]
    paths:
      - "booking/**"
      - ".github/workflows/booking-ci.yml"
  pull_request:
    paths:
      - "booking/**"
      - ".github/workflows/booking-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hotel_vastu_booking
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: booking
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, pdo_mysql
          coverage: none
      - name: Prepare test environment
        run: cp .env.example .env
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: SQLite feature suite
        run: php artisan test --fail-on-warning --exclude-group=mysql
      - name: Route and view cache build
        run: |
          php artisan route:cache
          php artisan view:cache
          php artisan route:clear
          php artisan view:clear
      - name: MySQL production-contract suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hotel_vastu_booking
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --fail-on-warning
