name: Booking Lockfile Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/booking-lock-once.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, pdo_mysql
          coverage: none
      - name: Generate booking Composer lock
        working-directory: booking
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          test -f booking/composer.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add booking/composer.lock
          git rm .github/workflows/booking-lock-once.yml
          git commit -m "Lock booking dependencies"
          git push origin HEAD:main
